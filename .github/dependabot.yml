version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
    labels: [type:chore, area:infra]
    groups:
      gradle-minor:
        update-types: [minor, patch]
    ignore:
      # The version is the one pandaspigot-api 1.8.8 declares (4.24.0), and PandaSpigot provides
      # exactly that at runtime. The legacy bridge compiles against the same version
      # (gradle/libs.versions.toml), so neither 5.x nor a newer 4.x is wanted: both would compile
      # against classes the servers do not have. It moves when pandaspigot-api moves. Paper and
      # Velocity bring their own Adventure 5.x.
      - dependency-name: net.kyori:adventure-api
      # JLine 4.4.8 no longer turns Ctrl+C into a UserInterruptException in LineReader.readLine
      # (reproduced with a DumbTerminal; 3.30.17 does). Ctrl+C is how the console asks for
      # shutdown. Revisit when a 4.x release fixes it (issue #71).
      - dependency-name: org.jline:*
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    labels: [type:chore, area:infra]
    groups:
      actions:
        patterns: ['*']

  # Base images of the VectoraCloud image (pinned by digest) and the MariaDB image in compose.yml.
  - package-ecosystem: docker
    directory: /cloud/dist/docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)
    labels: [type:chore, area:infra]
    ignore:
      # MariaDB follows the long-term-support series (12.3 until 2029-06), the same one managed
      # mode downloads. Rolling releases (12.4, 13.x) are moved to by hand.
      - dependency-name: mariadb
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # Build image of the ClusterFuzzLite fuzzers.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)
    labels: [type:chore, area:infra]

  - package-ecosystem: docker-compose
    directory: /cloud/dist/docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)
    labels: [type:chore, area:infra]
    ignore:
      # MariaDB follows the long-term-support series (12.3 until 2029-06), the same one managed
      # mode downloads. Rolling releases (12.4, 13.x) are moved to by hand.
      - dependency-name: mariadb
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # Enable once services/website exists (stage 8).
