name: Commit checks

# Two checks for every pull request into main, see CONTRIBUTING.md:
# - "PR title" validates the title against Conventional Commits. With squash merge the title
#   becomes the commit on main. For a single-commit PR the commit message is checked too,
#   because GitHub may offer it instead of the title.
# - "DCO sign-off" requires a Signed-off-by trailer matching the commit author on every
#   commit in the PR. Commits by dependabot[bot] are exempt, Dependabot cannot sign off.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Check Conventional Commits title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: false

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Check Signed-off-by on every commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The commits endpoint returns at most 250 commits per pull request.
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | {sha, login: (.author.login // ""), email: .commit.author.email, message: .commit.message} | @base64' \
            > commits.txt
          failed=0
          while IFS= read -r row; do
            commit=$(printf '%s' "$row" | base64 -d)
            sha=$(jq -r .sha <<<"$commit")
            login=$(jq -r .login <<<"$commit")
            email=$(jq -r .email <<<"$commit")
            if [ "$login" = "dependabot[bot]" ]; then
              echo "skip ${sha:0:7}: dependabot[bot]"
              continue
            fi
            if jq -r .message <<<"$commit" | git interpret-trailers --parse \
                | grep -i '^Signed-off-by: ' | grep -qiF "<${email}>"; then
              echo "ok   ${sha:0:7}"
            else
              echo "::error::Commit ${sha:0:7} has no Signed-off-by trailer for <${email}>. Fix with 'git commit --amend -s' or 'git rebase --signoff main'."
              failed=1
            fi
          done < commits.txt
          exit "$failed"
