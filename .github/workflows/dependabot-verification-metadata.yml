name: Dependabot verification metadata

# Dependabot bumps versions in gradle/libs.versions.toml and the build files, but it does not
# touch gradle/verification-metadata.xml. Without new checksums every Gradle run of such a pull
# request fails dependency verification. This workflow writes them and commits them to the
# Dependabot branch. Flow and review checklist: docs/dependency-verification.md
#
# Security:
# - Plain pull_request event, no pull_request_target. It only runs for pull requests that
#   Dependabot opened from a branch of this repository and when Dependabot triggered the run.
# - "regenerate" runs Gradle (and with it the build scripts and plugins of the pull request) with a
#   read-only token and without persisted credentials. Its only output is the metadata file.
# - "commit" has contents: write but runs no code from the pull request. It checks that the
#   artifact is a single verification metadata file, copies it over and pushes one commit to the
#   Dependabot branch. The push fails if the branch moved in the meantime.
# - A push with GITHUB_TOKEN starts no new workflow runs. A maintainer reviews the commit and then
#   pushes an empty signed-off commit to the branch, which runs every check on the new head.

on:
  pull_request:
    branches: [main]
    paths:
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'

permissions: {}

concurrency:
  group: dependabot-verification-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate verification metadata
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the Dependabot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Write the checksums
        run: bash gradle/update-verification-metadata.sh

      - name: Check what changed
        id: diff
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "The verification metadata is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$changed" != " M gradle/verification-metadata.xml" ]; then
            echo "::error::Only gradle/verification-metadata.xml may change, got:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the metadata
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit verification metadata
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the metadata commit to the Dependabot branch
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Credentials stay in the checkout for the push. Nothing from the pull request is executed.
      - name: Checkout the Dependabot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download the metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/verification-metadata

      - name: Check and apply the metadata
        env:
          DIR: ${{ runner.temp }}/verification-metadata
        run: |
          fail() { echo "::error::$1"; exit 1; }
          src="$DIR/verification-metadata.xml"
          [ "$(find "$DIR" -mindepth 1 | wc -l)" -eq 1 ] || fail "The artifact must hold exactly one file."
          [ -f "$src" ] && [ ! -L "$src" ] || fail "The artifact holds no regular verification-metadata.xml."
          [ "$(wc -c < "$src")" -lt 5000000 ] || fail "The metadata file is unexpectedly large."
          sed -n 2p "$src" | grep -q '^<verification-metadata xmlns="https://schema.gradle.org/dependency-verification"' \
            || fail "The file is not Gradle verification metadata."
          if grep -q '<!--' "$src"; then fail "The metadata file must not contain XML comments."; fi
          # The build code of the pull request produced the file. It may add or change checksums,
          # but the <configuration> block (trusted artifacts, keys, verification switches) has to
          # be byte for byte the one already on the branch.
          config() { tr -d '\r' < "$1" | awk '/<configuration>/ { f = 1 } f { print } /<\/configuration>/ { exit }'; }
          [ "$(config "$src")" = "$(config gradle/verification-metadata.xml)" ] \
            || fail "The <configuration> block changed. Only checksums may change in this workflow."
          cp "$src" gradle/verification-metadata.xml
          git diff --stat

      - name: Commit and push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$BRANCH" in
            dependabot/*) ;;
            *) echo "::error::Not a Dependabot branch."; exit 1 ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/verification-metadata.xml
          git commit -s -m "build(deps): update dependency verification metadata" \
            -m "Written by gradle/update-verification-metadata.sh in $RUN_URL"
          # Not forced: the push fails if Dependabot moved the branch since this run started.
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "### Verification metadata committed"
            echo "Review the new checksums in the pull request. A push by this workflow does not start"
            echo "the other checks: push an empty signed-off commit to the branch to run them."
          } >> "$GITHUB_STEP_SUMMARY"
