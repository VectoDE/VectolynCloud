name: Wiki sync

# Mirrors docs/wiki/** into the GitHub wiki (VectoDE/VectolynCloud.wiki.git).
# The wiki git repository only exists after the first page has been created
# in the web UI once. Until then this workflow fails at the clone step.

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GITHUB_TOKEN needs contents:write to push to the wiki repo
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Push docs/wiki to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$wiki_url" wiki; then
            echo "::error::Wiki repository not found. Create the first wiki page in the web UI, then re-run."
            exit 1
          fi
          # The repo is the source of truth: pages removed from docs/wiki are removed from the wiki.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/wiki/. wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${SHA::7}"
          git push origin HEAD
