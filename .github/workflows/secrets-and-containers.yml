name: Secrets and containers

# Secret scanning of the whole history (gitleaks, TruffleHog), Dockerfile lint (Hadolint),
# a Trivy scan of the repository, and the container image: Syft writes the SBOM, Grype and Trivy
# scan the image. Findings fail the job. A finding is fixed (for example by a newer base image
# digest) or, if it is a false positive, allowed in the tool's own configuration with a reason
# (.gitleaks.toml, .trivyignore.yaml, .grype.yaml). Nothing here has secrets or write access
# except the SARIF upload to code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 4 * * *'   # new advisories appear daily, the image is rescanned without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-and-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary of the release, checked against a checksum that is pinned in this file.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # .gitleaks.toml extends the default rules; the test values it allows are listed there.
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --no-banner --redact --verbose \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 14
          if-no-files-found: ignore

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443

      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Verified, unknown and unverified results all count, so a credential the issuer no longer
      # accepts is still reported. Verification calls the issuers' APIs, which the runner blocks;
      # the detectors alone decide here.
      - name: Scan the history
        run: |
          docker run --rm --volume "$PWD:/repo:ro" "$TRUFFLEHOG_IMAGE" \
            git file:///repo --no-update --fail --no-verification --results=verified,unknown,unverified

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - cloud/dist/docker/Dockerfile
          - .clusterfuzzlite/Dockerfile
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml

  trivy-repo:
    name: Trivy (repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload the SARIF results to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mirror.gcr.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vulnerabilities, secrets, misconfiguration and licenses of the files in the repository.
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-repo.sarif

      - name: Upload to code scanning
        if: ${{ !cancelled() && hashFiles('trivy-repo.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo

  image:
    name: Image (Syft, Grype, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the SARIF results to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mirror.gcr.io:443
            toolbox-data.anchore.io:443
            grype.anchore.io:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build VectolynCloud.jar
        run: bash ./gradlew :cloud:launcher:cloudJar --no-daemon --stacktrace

      # The release path of the Dockerfile: the jar comes in as the named context "jar".
      - name: Build the image
        run: |
          set -euo pipefail
          mkdir jar-context
          cp cloud/launcher/build/cloud/VectolynCloud.jar jar-context/
          docker buildx build --file cloud/dist/docker/Dockerfile \
            --build-context jar=jar-context --build-arg VERSION=0.0.0-ci \
            --platform linux/amd64 --load --tag vectolyn-cloud:scan .

      # The SBOM of the image: what is in it, with licenses. Kept as artifact.
      - name: Syft SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: vectolyn-cloud:scan
          format: spdx-json
          output-file: vectolyn-cloud-image.spdx.json
          artifact-name: vectolyn-cloud-image.spdx.json
          upload-release-assets: false
          dependency-snapshot: false

      - name: Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: vectolyn-cloud-image.spdx.json
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: sarif

      - name: Upload Grype results
        if: ${{ !cancelled() && steps.grype.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      - name: Trivy (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vectolyn-cloud:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy results
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
