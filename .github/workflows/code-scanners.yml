name: Code and dependency scanners

# - Semgrep: static analysis of Java, workflows and secrets with the registry rule sets.
# - OSV-Scanner: known vulnerabilities of every dependency in gradle/verification-metadata.xml.
# - OWASP Dependency-Check: the same from the NVD side, on the jars the cloud ships.
# - SonarCloud and Snyk: need an account of the owner (token as repository secret). Without the
#   token their jobs report a notice and end green; with it they run and gate. Setup steps:
#   docs/code-scanning.md.
# CodeQL has its own workflow (codeql.yml).
# Findings fail the job. A finding is fixed, or allowed in the scanner's own file with a reason
# and an expiry date (osv-scanner.toml, .semgrepignore, `// nosemgrep: rule-id` with a reason).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '53 3 * * *'   # advisories appear daily, so the dependencies are rescanned without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-scanners-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
  OSV_SCANNER_VERSION: 2.7.1
  OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
  DEPENDENCY_CHECK_IMAGE: owasp/dependency-check:13.0.0@sha256:0e8f69ad5b00d62000937f4e57189812343f6903d9c83ee712012d51542a020a

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload the SARIF results to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            semgrep.dev:443
            metrics.semgrep.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --error: any finding fails the job. Metrics are off, no account is used.
      - name: Semgrep
        run: |
          set -euo pipefail
          chmod 0777 "$PWD"
          docker run --rm --volume "$PWD:/src" --workdir /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics off --error --disable-version-check \
              --config p/default --config p/java --config p/security-audit \
              --config p/owasp-top-ten --config p/github-actions --config p/secrets \
              --exclude 'templates' --exclude 'branding' \
              --sarif-output=semgrep.sarif

      - name: List the findings
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        run: |
          jq -r '.runs[].results[]? | select((.suppressions // []) | length == 0) | [.level, .ruleId, (.locations[0].physicalLocation.artifactLocation.uri + ":" + (.locations[0].physicalLocation.region.startLine|tostring)), (.message.text | split("\n")[0])] | @tsv' semgrep.sarif | sort -u | head -100

      - name: Upload to code scanning
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # upload the SARIF results to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary, checked against a checksum that is pinned in this file.
      - name: Install OSV-Scanner
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      # Reads gradle/verification-metadata.xml (every artifact the build resolves, with its
      # version) and the other lockfiles. osv-scanner.toml lists the allowed advisories.
      - name: Scan
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --config osv-scanner.toml \
            --format sarif --output osv-scanner.sarif .
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --config osv-scanner.toml --format table .

      - name: Upload to code scanning
        if: ${{ !cancelled() && hashFiles('osv-scanner.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            services.nvd.nist.gov:443
            nvd.nist.gov:443
            jeremylong.github.io:443
            ossindex.sonatype.org:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      # The NVD allows a usable download rate only with a (free) API key. Without it the job
      # ends green with a notice, so a missing key never looks like a clean scan in the log.
      - name: Check the NVD API key
        id: key
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dependency-Check skipped::Repository secret NVD_API_KEY is not set. Request a free key at https://nvd.nist.gov/developers/request-an-api-key and add it (docs/code-scanning.md)."
          fi

      - name: Checkout
        if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        if: steps.key.outputs.enabled == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.key.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The shipped jar contains every library with its Maven metadata, so one scan covers them.
      - name: Build VectolynCloud.jar
        if: steps.key.outputs.enabled == 'true'
        run: bash ./gradlew :cloud:launcher:cloudJar --no-daemon --stacktrace

      - name: Cache the NVD data
        if: steps.key.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      - name: Dependency-Check
        if: steps.key.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p dependency-check-data dependency-check-report
          chmod -R 0777 dependency-check-data dependency-check-report
          docker run --rm \
            --volume "$PWD/cloud/launcher/build/cloud:/scan:ro" \
            --volume "$PWD/dependency-check-data:/usr/share/dependency-check/data" \
            --volume "$PWD/dependency-check-report:/report" \
            --env NVD_API_KEY \
            "$DEPENDENCY_CHECK_IMAGE" \
            --scan /scan --format HTML --format SARIF --out /report \
            --project VectolynCloud --nvdApiKey "$NVD_API_KEY" \
            --failOnCVSS 7 --enableRetired --disableAssembly

      - name: Upload report
        if: ${{ !cancelled() && steps.key.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: dependency-check-report
          retention-days: 30

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            sonarcloud.io:443
            api.sonarcloud.io:443
            scanner.sonarcloud.io:443
            analysis-sensorcache-eu-central-1-prod.s3.amazonaws.com:443
            sonarsource.bintray.com:443
            binaries.sonarsource.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      - name: Check the token
        id: token
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarCloud skipped::Repository secret SONAR_TOKEN is not set (the token of the SonarCloud project, or the run comes from a fork). Setup: docs/code-scanning.md."
          fi

      - name: Checkout (full history for the blame data)
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.token.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Compiles and tests, so the scan gets the class files and the coverage reports.
      - name: Build and test
        if: steps.token.outputs.enabled == 'true'
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: SonarCloud scan
        if: steps.token.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1

  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            downloads.snyk.io:443
            static.snyk.io:443
            api.snyk.io:443
            api.eu.snyk.io:443
            app.snyk.io:443
            snyk.io:443
            deeproxy.snyk.io:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      - name: Check the token
        id: token
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Snyk skipped::Repository secret SNYK_TOKEN is not set (or the run comes from a fork). Setup: docs/code-scanning.md."
          fi

      - name: Checkout
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Snyk
        if: steps.token.outputs.enabled == 'true'
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      # Open source: all Gradle projects, from HIGH up. Code: Snyk Code (SAST), from HIGH up.
      - name: Snyk Open Source
        if: steps.token.outputs.enabled == 'true'
        run: snyk test --all-projects --severity-threshold=high

      - name: Snyk Code
        if: steps.token.outputs.enabled == 'true'
        run: snyk code test --severity-threshold=high
