name: Operations

# Dry run of everything the release ships, without publishing anything:
# start scripts on Linux, macOS and Windows, the release archives (cloud/dist/package.sh,
# the same script release.yml runs), the release banner (tools/release-banner), the systemd
# unit on a real systemd, the container image (built from source and through the release path
# with the jar as named context, both without push), compose.yml and the Pterodactyl egg.
# Nothing here has write permissions or secrets.

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'plugins/bridge/**'
      - 'common/protocol/**'
      - 'common/client/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.dockerignore'
      - '.gitattributes'
      - '.github/scripts/**'
      - '.github/workflows/operations.yml'
      - '.github/workflows/release.yml'
      - 'tools/**'
      - 'branding/fonts/**'
      - 'branding/png/release-banner-background*.png'
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'plugins/bridge/**'
      - 'common/protocol/**'
      - 'common/client/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.dockerignore'
      - '.gitattributes'
      - '.github/scripts/**'
      - '.github/workflows/operations.yml'
      - '.github/workflows/release.yml'
      - 'tools/**'
      - 'branding/fonts/**'
      - 'branding/png/release-banner-background*.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  lint:
    name: Lint scripts, workflows, egg and compose
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Line endings
        run: |
          set -euo pipefail
          for f in cloud/dist/start.bat cloud/dist/start.ps1; do
            if [ "$(grep -c $'\r$' "$f" || true)" -ne "$(wc -l < "$f")" ]; then
              echo "::error file=$f::needs CRLF line ends (.gitattributes)"; exit 1
            fi
          done
          for f in cloud/dist/start.sh cloud/dist/package.sh cloud/dist/systemd/install.sh .github/scripts/smoke-start-unix.sh .github/scripts/smoke-jar-runtime.sh .github/scripts/release-gate.sh .github/scripts/release-changelog.sh gradle/update-verification-metadata.sh \
            tools/release-banner/banner-from-tag.sh tools/release-banner/check-tag.sh; do
            if grep -q $'\r' "$f"; then
              echo "::error file=$f::needs LF line ends (.gitattributes)"; exit 1
            fi
          done
          echo "Line endings OK."

      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck cloud/dist/start.sh cloud/dist/package.sh cloud/dist/systemd/install.sh .github/scripts/smoke-start-unix.sh .github/scripts/smoke-jar-runtime.sh \
            .github/scripts/release-gate.sh .github/scripts/release-changelog.sh \
            gradle/update-verification-metadata.sh tools/release-banner/banner-from-tag.sh tools/release-banner/check-tag.sh
          # The installer script inside the egg (runs with ash in ghcr.io/pterodactyl/installers:alpine).
          for egg in cloud/dist/pterodactyl/egg-vectolyn-cloud.json cloud/dist/pelican/egg-vectolyn-cloud.json; do
            jq -r '.scripts.installation.script' "$egg" | shellcheck --shell=sh -
          done
          echo "ShellCheck OK."

      # Both eggs on their own (structure, variables against their rules, the setup file the
      # daemon would write) and against each other: same startup, variables, setup file, installer.
      - name: Pterodactyl and Pelican egg
        run: |
          python3 -I .github/scripts/check-egg.py \
            cloud/dist/pterodactyl/egg-vectolyn-cloud.json cloud/dist/pelican/egg-vectolyn-cloud.json

      # The official image pinned by digest (it brings ShellCheck for the run: blocks), instead of
      # an unpinned "go install" or a downloaded binary.
      - name: actionlint
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo "$ACTIONLINT_IMAGE" -color

      - name: Compose file
        working-directory: cloud/dist/docker
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf 'ci-only' > secrets/db_password
          printf 'ci-only' > secrets/db_root_password
          cp setup.example.yml setup.yml
          docker compose -f compose.yml config --quiet
          echo "compose.yml OK."

  jar:
    name: Build VectolynCloud.jar and release archives
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build VectolynCloud.jar
        run: bash ./gradlew :cloud:launcher:cloudJar --no-daemon --stacktrace

      # Same call as in release.yml, with a dummy version.
      - name: Package (dry run)
        run: |
          set -euo pipefail
          bash cloud/dist/package.sh 0.0.0-ci \
            cloud/launcher/build/cloud/VectolynCloud.jar ops-dist
          (cd ops-dist && sha256sum -- *.jar *.zip *.tar.gz *.yml | tee SHA256SUMS)
          tar -tzvf ops-dist/VectolynCloud-0.0.0-ci-linux-macos.tar.gz
          unzip -l ops-dist/VectolynCloud-0.0.0-ci-windows.zip
          tar -tzvf ops-dist/VectolynCloud-0.0.0-ci-templates.tar.gz | sed -n '1,20p'
          # Exactly the files release.yml lists in SHA256SUMS (plus the banners it adds later).
          test "$(find ops-dist -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')" = \
            "VectolynCloud-0.0.0-ci-linux-macos.tar.gz VectolynCloud-0.0.0-ci-templates.tar.gz VectolynCloud-0.0.0-ci-windows.zip VectolynCloud.jar setup.example.yml "
          # Every server template of the repository is in the templates archive.
          tar -tzf ops-dist/VectolynCloud-0.0.0-ci-templates.tar.gz > "$RUNNER_TEMP/templates.lst"
          for dir in templates/*/; do
            grep -q "/templates/$(basename "$dir")/" "$RUNNER_TEMP/templates.lst" \
              || { echo "::error::template $dir is missing in the templates archive"; exit 1; }
          done

      # The archives must not depend on when they are built (reproducible release files).
      - name: Package again and compare
        run: |
          set -euo pipefail
          bash cloud/dist/package.sh 0.0.0-ci \
            cloud/launcher/build/cloud/VectolynCloud.jar "$RUNNER_TEMP/again"
          (cd "$RUNNER_TEMP/again" && sha256sum -- *.jar *.zip *.tar.gz *.yml) | diff - <(cd ops-dist && sha256sum -- *.jar *.zip *.tar.gz *.yml)
          echo "Archives are reproducible."

      # The tag check of release.yml (check-tag.sh, the version rules of ReleaseVersion) on every
      # rule: what is allowed and its GitHub pre-release flag, what must stop a release.
      - name: Release tag rules (dry run)
        run: |
          set -euo pipefail
          check() {  # check <tag> <channel> <prerelease>
            got=$(bash tools/release-banner/check-tag.sh "$1" --stacktrace)
            want=$(printf 'channel=%s\nprerelease=%s' "$2" "$3")
            if [ "$got" != "$want" ]; then
              printf '::error::%s gave:\n%s\n' "$1" "$got"; exit 1
            fi
            echo "$1: $2, pre-release $3"
          }
          check v0.2.0-dev dev true
          check v0.2.0-dev.3 dev true
          check v1.0.0-alpha.1 alpha true
          check v1.0.0-beta.2 beta true
          check v1.0.0-rc.1 rc true
          check v1.4.0-lts lts false
          check v1.0.0 stable false
          reject() {  # reject <tag> <part of the reason>
            if bash tools/release-banner/check-tag.sh "$1" > /dev/null 2> "$RUNNER_TEMP/tag.log"; then
              echo "::error::$1 must be rejected"; exit 1
            fi
            if ! grep -F -- "$2" "$RUNNER_TEMP/tag.log"; then
              cat "$RUNNER_TEMP/tag.log"; echo "::error::$1: reason without \"$2\""; exit 1
            fi
          }
          reject v0.2.0 'a 0.x version may only be released with -dev'
          reject v0.2.0-alpha.1 'a 0.x version may only be released with -dev'
          reject v0.2.0-rc.1 'a 0.x version may only be released with -dev'
          reject v1.4.0-lts.2 '-lts takes no counter'
          reject v1.0.0-nightly.1 'unknown suffix -nightly.1'
          reject v1.0.0-RC.1 'unknown suffix -RC.1'
          reject v1.0.0+build.7 'has build metadata'
          reject v1.0 'not a release tag'
          reject v01.0.0 'not a release tag'
          reject 1.0.0 'not a release tag'

      # The banner step of release.yml (same script, same Gradle task) on local tags; nothing
      # leaves the runner except a short-lived artifact to look at. Covers every badge, an
      # annotated tag with a title, an empty message, a message that is only a signature, a
      # lightweight tag and tags that break the version rules, and renders the first case twice
      # to prove the PNGs are reproducible.
      - name: Release banner (dry run)
        env:
          GIT_COMMITTER_DATE: '2026-10-30T12:00:00Z'
        run: |
          set -euo pipefail
          tagger=(-c user.name=ci -c user.email=ci@invalid)
          git "${tagger[@]}" tag -a -f v1.0.0-beta.2 -m 'Stage 2: cloud core' -m 'Body text, never shown.'
          git "${tagger[@]}" tag -a -f v1.0.1 -m ''
          printf -- '-----BEGIN PGP SIGNATURE-----\n\nci\n-----END PGP SIGNATURE-----\n' > "$RUNNER_TEMP/sig.txt"
          git "${tagger[@]}" tag -a -f --cleanup=verbatim v1.0.0-rc.1 -F "$RUNNER_TEMP/sig.txt"
          git "${tagger[@]}" tag -a -f v0.2.0-dev.3 -m 'Stage 2: cloud core'
          git "${tagger[@]}" tag -a -f v1.0.0-alpha.1 -m ''
          git "${tagger[@]}" tag -a -f v1.4.0-lts -m 'Long-term support'
          git tag -f v1.0.0
          git tag -f v0.2.0
          git tag -f v0.2.0-alpha.1
          git tag -f v1.0
          banner() {  # banner <tag> <out-dir> <expected summary>
            bash tools/release-banner/banner-from-tag.sh "$1" "$2" --stacktrace | tee "$RUNNER_TEMP/banner.log"
            grep -qF "Release banner for $1: $3" "$RUNNER_TEMP/banner.log"
          }
          banner v1.0.0-beta.2 ops-banner 'version u 10, badge BETA, title "Stage 2: cloud core", date Oct 30, 2026'
          banner v1.0.1 ops-banner 'version u 12, badge none, title none, date Oct 30, 2026'
          banner v1.0.0-rc.1 ops-banner 'version u 12, badge RC, title none, date Oct 30, 2026'
          banner v0.2.0-dev.3 ops-banner 'version u 12, badge PRE-RELEASE, title "Stage 2: cloud core", date Oct 30, 2026'
          banner v1.0.0-alpha.1 ops-banner 'version u 10, badge ALPHA, title none, date Oct 30, 2026'
          banner v1.4.0-lts ops-banner 'version u 12, badge LTS, title "Long-term support", date Oct 30, 2026'
          banner v1.0.0 ops-banner 'version u 12, badge none, title none, date'
          for t in v0.2.0 v0.2.0-alpha.1 v1.0; do
            if bash tools/release-banner/banner-from-tag.sh "$t" "$RUNNER_TEMP/invalid"; then
              echo "::error::$t breaks the version rules and must fail the banner"; exit 1
            fi
          done
          (cd ops-banner && file -- *.png)
          test "$(file -b ops-banner/VectolynCloud-1.0.0-beta.2-banner.png | cut -d, -f2)" = ' 1280 x 320'
          test "$(file -b ops-banner/VectolynCloud-1.0.0-beta.2-banner-2x.png | cut -d, -f2)" = ' 2560 x 640'
          banner v1.0.0-beta.2 "$RUNNER_TEMP/banner-again" 'version u 10'
          (cd "$RUNNER_TEMP/banner-again" && sha256sum -- *.png) | diff - <(cd ops-banner && sha256sum -- VectolynCloud-1.0.0-beta.2-*.png)
          echo "Banners are reproducible."

      - name: Upload banner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-banner-dry-run
          path: ops-banner/
          if-no-files-found: error
          retention-days: 3

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ops-dist
          path: ops-dist/
          if-no-files-found: error
          retention-days: 3

  # "java -jar VectolynCloud.jar" is the one entry point, so the jar itself runs on every platform
  # and Java version that is supported: Windows x64, Linux x64 and arm64, macOS arm64 and x64, and
  # Java 21 (the minimum) up to the newest release. 25 is the LTS the project builds with.
  runtime:
    name: Jar on Java ${{ matrix.java }} (${{ matrix.label }})
    needs: jar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: Linux x64, java: '21' }
          - { os: ubuntu-latest, label: Linux x64, java: '25' }
          - { os: ubuntu-latest, label: Linux x64, java: '27' }
          - { os: ubuntu-24.04-arm, label: Linux arm64, java: '21' }
          - { os: ubuntu-24.04-arm, label: Linux arm64, java: '25' }
          - { os: ubuntu-24.04-arm, label: Linux arm64, java: '27' }
          - { os: macos-26, label: macOS arm64, java: '21' }
          - { os: macos-26, label: macOS arm64, java: '25' }
          - { os: macos-26, label: macOS arm64, java: '27' }
          - { os: macos-15-intel, label: macOS x64, java: '21' }
          - { os: macos-15-intel, label: macOS x64, java: '25' }
          # Temurin 27 has no macOS x64 build (Adoptium API); 26 is the newest Java there.
          - { os: macos-15-intel, label: macOS x64, java: '26' }
          - { os: windows-latest, label: Windows x64, java: '21' }
          - { os: windows-latest, label: Windows x64, java: '25' }
          - { os: windows-latest, label: Windows x64, java: '27' }
    steps:
      # The jobs above run with egress blocking; the harden-runner agent only exists for Linux
      # x64 runners, so these jobs go without it. They have no secrets and read-only permissions.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ops-dist
          path: ops-dist

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: java -jar VectolynCloud.jar
        shell: bash
        run: bash .github/scripts/smoke-jar-runtime.sh ops-dist/VectolynCloud.jar

  # The eggs as a panel runs them, against the newest published release: the installer script in
  # the panel's own installer image (entrypoint ash, files in /mnt/server), then the startup command
  # in the panel's Java image with the setup file the daemon writes. No panel is needed for this;
  # what only a panel shows is listed in docs/cloud/operations.md.
  eggs:
    name: Egg installation (${{ matrix.panel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - panel: Pterodactyl
            egg: cloud/dist/pterodactyl/egg-vectolyn-cloud.json
            java-image: ghcr.io/pterodactyl/yolks:java_25
          - panel: Pelican
            egg: cloud/dist/pelican/egg-vectolyn-cloud.json
            java-image: ghcr.io/pelican-eggs/yolks:java_25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer (latest release)
        env:
          EGG: ${{ matrix.egg }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/install" "$RUNNER_TEMP/server"
          jq -r '.scripts.installation.script' "$EGG" > "$RUNNER_TEMP/install/install.sh"
          image=$(jq -r '.scripts.installation.container' "$EGG")
          entry=$(jq -r '.scripts.installation.entrypoint' "$EGG")
          docker run --rm \
            --volume "$RUNNER_TEMP/server:/mnt/server" \
            --volume "$RUNNER_TEMP/install:/mnt/install:ro" \
            "$image" "$entry" /mnt/install/install.sh
          ls -l "$RUNNER_TEMP/server"
          test -f "$RUNNER_TEMP/server/VectolynCloud.jar"
          test -f "$RUNNER_TEMP/server/SHA256SUMS"
          test -f "$RUNNER_TEMP/server/setup.yml"
          cat "$RUNNER_TEMP/server/.vectolyn-version"
          (cd "$RUNNER_TEMP/server" && grep -E '^[0-9a-f]{64}  VectolynCloud\.jar$' SHA256SUMS | sha256sum --check --strict -)

      # A version that does not exist must stop the installer and leave no jar behind.
      - name: Installer (unknown version stops)
        env:
          EGG: ${{ matrix.egg }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty"
          image=$(jq -r '.scripts.installation.container' "$EGG")
          if docker run --rm -e VECTOLYN_VERSION=0.0.1-nonexistent \
              --volume "$RUNNER_TEMP/empty:/mnt/server" \
              --volume "$RUNNER_TEMP/install:/mnt/install:ro" \
              "$image" ash /mnt/install/install.sh; then
            echo "::error::the installer accepted a version that does not exist"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/empty/VectolynCloud.jar"
          echo "Unknown version stopped, no jar left."

      # The startup command of the egg with its default variables, in the panel's Java image as
      # the unprivileged panel user (the root check passes), with the setup file the daemon writes
      # (eula true here, the database embedded: the test needs no MariaDB download).
      - name: Startup in the panel image
        env:
          EGG: ${{ matrix.egg }}
          JAVA_IMAGE: ${{ matrix.java-image }}
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/server"
          # The installer ran as root in its container; the panel user must be able to write.
          sudo chmod -R a+rwX "$server"
          printf 'schema-version: 1\neula: true\nlanguage: en\nnetwork-name: Vectolyn\nnetwork:\n  bind: 0.0.0.0\n  java-port: 25565\n  bedrock-port: 19132\ndatabase:\n  mode: h2\n' > "$server/setup.yml"
          startup=$(jq -r '.startup // .startup_commands.Default' "$EGG")
          while read -r name value; do
            startup=${startup//"{{${name}}}"/${value}}
          done < <(jq -r '.variables[] | "\(.env_variable) \(.default_value)"' "$EGG")
          case "$startup" in *"{{"*) echo "::error::unresolved variable in: $startup"; exit 1 ;; esac
          echo "Startup: $startup"
          done_text=$(jq -r '.config.startup | if type == "string" then fromjson else . end | .done' "$EGG")
          docker run -d --name egg-ci --volume "$server:/home/container" --workdir /home/container \
            "$JAVA_IMAGE" bash -c "$startup"
          up=false
          for _ in $(seq 1 60); do
            if docker logs egg-ci 2>&1 | grep -qF "$done_text"; then
              up=true; break
            fi
            [ "$(docker inspect -f '{{.State.Running}}' egg-ci)" = true ] || break
            sleep 2
          done
          docker logs egg-ci
          test "$up" = true
          docker stop -t 120 egg-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' egg-ci)
          echo "Exit code after stop: $code"
          # 130: the Pelican image stops with SIGINT (the egg's stop command is ^C), a clean shutdown.
          case "$code" in 0|130|143) ;; *) echo "::error::unexpected exit code $code"; exit 1 ;; esac

  # The release process around the files: the milestone gate for every channel and the changelog of
  # a release, both on fixtures (a throwaway repository), so the checks do not depend on the state
  # of this repository's milestones. release.yml runs the same scripts on a real tag.
  release-process:
    name: Release gate and changelog
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Milestone gate
        run: |
          set -euo pipefail
          gate=$PWD/.github/scripts/release-gate.sh
          open='[{"title":"Stage 1","open_issues":0,"closed_issues":4,"html_url":"u"},{"title":"Stage 2: core","open_issues":0,"closed_issues":9,"html_url":"u"},{"title":"Alpha","open_issues":0,"closed_issues":3,"html_url":"u"},{"title":"Beta","open_issues":0,"closed_issues":2,"html_url":"u"},{"title":"RC","open_issues":0,"closed_issues":1,"html_url":"u"}]'
          printf '%s' "$open" > "$RUNNER_TEMP/all-closed.json"
          # one open issue in the named milestone
          for name in Alpha Beta RC "Stage 2: core"; do
            jq --arg n "$name" 'map(if .title == $n then .open_issues = 1 else . end)' "$RUNNER_TEMP/all-closed.json" \
              > "$RUNNER_TEMP/open-${name// /_}.json"
          done
          jq 'map(select(.title != "Beta"))' "$RUNNER_TEMP/all-closed.json" > "$RUNNER_TEMP/no-beta.json"
          jq 'map(select(.title | test("^Stage ") | not))' "$RUNNER_TEMP/all-closed.json" > "$RUNNER_TEMP/no-stage.json"
          expect() {  # expect <exit code> <channel> <json file>
            local want=$1 channel=$2 file=$3 rc=0
            bash "$gate" "$channel" "$file" > "$RUNNER_TEMP/gate.log" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/gate.log"
            if [ "$rc" -ne "$want" ]; then echo "::error::$channel with $file: exit $rc, expected $want"; exit 1; fi
            echo "ok: $channel with $(basename "$file") -> $rc"
          }
          expect 0 dev "$RUNNER_TEMP/open-Alpha.json"
          expect 0 alpha "$RUNNER_TEMP/all-closed.json"
          expect 1 alpha "$RUNNER_TEMP/open-Alpha.json"
          expect 0 alpha "$RUNNER_TEMP/open-RC.json"
          expect 0 beta "$RUNNER_TEMP/all-closed.json"
          expect 1 beta "$RUNNER_TEMP/open-Beta.json"
          expect 1 beta "$RUNNER_TEMP/no-beta.json"
          expect 0 rc "$RUNNER_TEMP/all-closed.json"
          expect 1 rc "$RUNNER_TEMP/open-RC.json"
          expect 0 stable "$RUNNER_TEMP/all-closed.json"
          expect 1 stable "$RUNNER_TEMP/open-RC.json"
          expect 1 stable "$RUNNER_TEMP/open-Stage_2:_core.json"
          expect 1 stable "$RUNNER_TEMP/no-stage.json"
          expect 0 lts "$RUNNER_TEMP/all-closed.json"
          expect 1 lts "$RUNNER_TEMP/open-Alpha.json"
          expect 64 nightly "$RUNNER_TEMP/all-closed.json"
          echo "Milestone gate OK."

      - name: Changelog
        run: |
          set -euo pipefail
          script=$PWD/.github/scripts/release-changelog.sh
          repo=$(mktemp -d)
          cd "$repo"
          git init -q
          git config user.name ci
          git config user.email ci@invalid
          git config commit.gpgsign false
          c() { git commit -q --allow-empty -m "$1"; }
          c 'feat: first thing'
          git tag v0.1.0-dev
          c 'feat(cloud): add the thing (#1)'
          c 'fix(node)!: change the exit code (#2)'
          c 'fix: plain fix (#3)'
          c 'perf(console): faster (#4)'
          c 'docs: explain (#5)'
          c 'ci(release): sign (#6)'
          c 'a subject without a type'
          git tag v0.2.0-dev
          c 'feat: after the tag'
          GITHUB_REPOSITORY=o/r bash "$script" v0.2.0-dev | tee "$RUNNER_TEMP/changelog.md"
          grep -q '^## Changes since v0.1.0-dev$' "$RUNNER_TEMP/changelog.md"
          grep -q '^### Breaking changes$' "$RUNNER_TEMP/changelog.md"
          grep -q '^- \*\*cloud:\*\* add the thing (#1)$' "$RUNNER_TEMP/changelog.md"
          grep -q '^- plain fix (#3)$' "$RUNNER_TEMP/changelog.md"
          grep -q '^### Performance$' "$RUNNER_TEMP/changelog.md"
          grep -q '^### Documentation$' "$RUNNER_TEMP/changelog.md"
          grep -q '^### Build, CI and maintenance$' "$RUNNER_TEMP/changelog.md"
          grep -q '^### Other$' "$RUNNER_TEMP/changelog.md"
          grep -q 'compare/v0.1.0-dev...v0.2.0-dev' "$RUNNER_TEMP/changelog.md"
          if grep -q 'after the tag' "$RUNNER_TEMP/changelog.md"; then echo "::error::a commit after the tag is in the changelog"; exit 1; fi
          # the first release has no previous tag: the whole history
          bash "$script" v0.1.0-dev | grep -q 'first thing'
          if bash "$script" v9.9.9 2> /dev/null; then echo "::error::an unknown tag must fail"; exit 1; fi
          echo "Changelog OK."

  start-scripts:
    name: Start scripts (${{ matrix.os }})
    needs: jar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      # On Windows harden-runner's agent only becomes active about a minute into the job and
      # then cuts off downloads already running (seen with Gradle), so Windows only audits.
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: ${{ runner.os == 'Windows' && 'audit' || 'block' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ops-dist
          path: ops-dist

      # Java 17 is too old on purpose: the bootstrap must print its "you need Java 21" message.
      - name: Set up JDK 17
        id: java17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up JDK 25
        id: java25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: start.sh
        if: runner.os != 'Windows'
        env:
          JAVA17: ${{ steps.java17.outputs.path }}
          JAVA25: ${{ steps.java25.outputs.path }}
        run: bash .github/scripts/smoke-start-unix.sh ops-dist

      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $results = @('cloud/dist/start.ps1', '.github/scripts/smoke-start-windows.ps1') |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error }
          if ($results) {
            $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
            exit 1
          }
          Write-Output 'PSScriptAnalyzer OK.'

      # Windows PowerShell 5.1, the version every Windows has; start.ps1 must work there.
      - name: start.bat and start.ps1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          JAVA17: ${{ steps.java17.outputs.path }}
          JAVA25: ${{ steps.java25.outputs.path }}
        run: .github/scripts/smoke-start-windows.ps1 -Dist ops-dist -Java25 $env:JAVA25 -Java17 $env:JAVA17

  systemd:
    name: systemd unit and installer
    needs: jar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            downloads.mariadb.org:443
            archive.mariadb.org:443
            fill.papermc.io:443
            fill-data.papermc.io:443
            repo.papermc.io:443
            libraries.luckperms.net:443
            repo1.maven.org:443
            repo.maven.apache.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ops-dist
          path: ops-dist

      - name: Set up JDK 25
        id: java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      # The MariaDB Linux archive links against libaio and libncurses (see docs/cloud/database.md).
      - name: MariaDB runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libaio1t64 libncurses6
          if [ ! -e /usr/lib/x86_64-linux-gnu/libaio.so.1 ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          fi

      # The installer from the release archive, as an operator runs it (with the archive from the
      # package step instead of the download, which only a published release can offer).
      - name: Install (install.sh)
        env:
          JAVA_DIR: ${{ steps.java.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf ops-dist/VectolynCloud-0.0.0-ci-linux-macos.tar.gz -C "$RUNNER_TEMP/unpacked"
          ls -l "$RUNNER_TEMP"/unpacked/*/
          sudo "$RUNNER_TEMP"/unpacked/VectolynCloud-0.0.0-ci-linux-macos/install.sh install \
            --archive ops-dist/VectolynCloud-0.0.0-ci-linux-macos.tar.gz --java-home "$JAVA_DIR" --no-start
          systemd-analyze --version | head -n 1
          sudo systemd-analyze verify /etc/systemd/system/vectolyn-cloud.service
          ls -l /opt/vectolyn
          if systemctl is-enabled --quiet vectolyn-cloud; then echo "::error::--no-start must not enable"; exit 1; fi
          # a second install must refuse
          if sudo /opt/vectolyn/install.sh install --archive ops-dist/VectolynCloud-0.0.0-ci-linux-macos.tar.gz --no-start; then
            echo "::error::install over an installation must fail"; exit 1
          fi

      # Without a setup the node starts, opens its channel and starts no server: enough to prove
      # that the hardening (read-only system, private /tmp, syscall filter) lets the JVM run.
      - name: Start, check, stop
        run: |
          set -euo pipefail
          sudo systemctl start vectolyn-cloud
          for _ in $(seq 1 60); do
            if sudo journalctl -u vectolyn-cloud --no-pager | grep -q 'Cloud channel listens on'; then
              break
            fi
            sleep 2
          done
          sudo journalctl -u vectolyn-cloud --no-pager
          sudo journalctl -u vectolyn-cloud --no-pager | grep -q 'Cloud channel listens on'
          systemctl is-active vectolyn-cloud
          pid=$(systemctl show -p MainPID --value vectolyn-cloud)
          user=$(ps -o user= -p "$pid")
          echo "Main PID $pid runs as $user"
          test "$user" = vectolyn
          sudo test -f /opt/vectolyn/config/cloud.yml
          sudo systemctl stop vectolyn-cloud
          result=$(systemctl show -p Result --value vectolyn-cloud)
          status=$(systemctl show -p ExecMainStatus --value vectolyn-cloud)
          echo "Result=$result ExecMainStatus=$status"
          sudo journalctl -u vectolyn-cloud --no-pager | tail -n 20
          test "$result" = success

      # update keeps the home, replaces the jar, keeps the previous one and starts the service again
      # when it ran before; a service that was stopped stays stopped.
      - name: Update (install.sh)
        run: |
          set -euo pipefail
          before=$(sudo sha256sum /opt/vectolyn/config/cloud.yml | cut -d' ' -f1)
          sudo systemctl start vectolyn-cloud
          sudo /opt/vectolyn/install.sh update --archive ops-dist/VectolynCloud-0.0.0-ci-linux-macos.tar.gz
          sudo test -f /opt/vectolyn/VectolynCloud.jar.previous
          systemctl is-active vectolyn-cloud
          test "$(sudo sha256sum /opt/vectolyn/config/cloud.yml | cut -d' ' -f1)" = "$before"
          test "$(sudo sha256sum /opt/vectolyn/VectolynCloud.jar | cut -d' ' -f1)" = "$(sha256sum ops-dist/VectolynCloud.jar | cut -d' ' -f1)"
          grep -q 'JAVA_HOME' /etc/systemd/system/vectolyn-cloud.service.d/java.conf
          sudo systemctl stop vectolyn-cloud
          sudo /opt/vectolyn/install.sh update --archive ops-dist/VectolynCloud-0.0.0-ci-linux-macos.tar.gz
          if systemctl is-active --quiet vectolyn-cloud; then echo "::error::a stopped service must stay stopped"; exit 1; fi

      # uninstall keeps the data; --purge removes the home and the user.
      - name: Uninstall (install.sh)
        run: |
          set -euo pipefail
          sudo /opt/vectolyn/install.sh uninstall
          test ! -e /etc/systemd/system/vectolyn-cloud.service
          test ! -e /etc/systemd/system/vectolyn-cloud.service.d
          sudo test ! -e /opt/vectolyn/VectolynCloud.jar
          sudo test -f /opt/vectolyn/config/cloud.yml
          id -u vectolyn
          sudo "$RUNNER_TEMP"/unpacked/VectolynCloud-0.0.0-ci-linux-macos/install.sh uninstall --purge
          sudo test ! -e /opt/vectolyn
          if id -u vectolyn 2>/dev/null; then echo "::error::--purge must remove the user"; exit 1; fi
          echo "Uninstall and purge OK."

      # The managed MariaDB under the unit's real hardening (ProtectSystem=strict, NoNewPrivileges,
      # SystemCallFilter, private /tmp): a fresh installation with a setup file that starts the
      # proxy only, so the node downloads and initialises MariaDB before the first server. The
      # log line "Database ready" proves MariaDB came up; after "systemctl stop" no mariadbd may
      # be left behind and the unit must end with success. (docs/cloud/operations.md)
      - name: Managed MariaDB under the hardening
        env:
          JAVA_DIR: ${{ steps.java.outputs.path }}
        run: |
          set -euo pipefail
          sudo "$RUNNER_TEMP"/unpacked/VectolynCloud-0.0.0-ci-linux-macos/install.sh install \
            --archive ops-dist/VectolynCloud-0.0.0-ci-linux-macos.tar.gz --java-home "$JAVA_DIR" --no-start
          printf '%s\n' 'schema-version: 1' 'eula: true' 'language: en' 'network-name: Vectolyn' \
            'servers:' '  proxy: true' '  lobby: false' '  survival: false' '  creative: false' '  end: false' '  minigame: false' \
            'database:' '  mode: managed' | sudo -u vectolyn tee /opt/vectolyn/setup.yml > /dev/null
          sudo mkdir -p /etc/systemd/system/vectolyn-cloud.service.d
          printf '[Service]\nExecStart=\nExecStart=/opt/vectolyn/start.sh --non-interactive --setup-file /opt/vectolyn/setup.yml\n' \
            | sudo tee /etc/systemd/system/vectolyn-cloud.service.d/setup.conf
          sudo systemctl daemon-reload
          sudo systemctl start vectolyn-cloud
          ready=false
          for _ in $(seq 1 450); do
            if sudo journalctl -u vectolyn-cloud --no-pager | grep -q 'Database ready'; then
              ready=true
              break
            fi
            systemctl is-active --quiet vectolyn-cloud || break
            sleep 2
          done
          sudo journalctl -u vectolyn-cloud --no-pager | tail -n 60
          if [ "$ready" != true ]; then
            sudo ls -ln /opt/vectolyn/database || true
            sudo cat /opt/vectolyn/database/vectolyn-mariadb.ini || true
            sudo head -n 25 /opt/vectolyn/database/mariadb.log || true
            sudo ps -u vectolyn -o pid,args || true
          fi
          test "$ready" = true
          mariadb_pid=$(pgrep -u vectolyn -f mariadbd | head -n 1)
          echo "mariadbd pid $mariadb_pid, cgroup:"
          cat "/proc/$mariadb_pid/cgroup"
          grep -q 'vectolyn-cloud.service' "/proc/$mariadb_pid/cgroup"
          sudo systemctl stop vectolyn-cloud
          result=$(systemctl show -p Result --value vectolyn-cloud)
          echo "Result=$result"
          sudo journalctl -u vectolyn-cloud --no-pager | tail -n 30
          if pgrep -u vectolyn -f mariadbd; then echo "::error::mariadbd outlived the unit"; exit 1; fi
          test "$result" = success

      - name: Exposure score
        if: always()
        run: sudo systemd-analyze security vectolyn-cloud.service --no-pager || true

  image:
    name: Container image (no push)
    needs: jar
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ops-dist
          path: ops-dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The default path: everything from source, as "docker build" and "docker compose build" do.
      - name: Build from source (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cloud/dist/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vectolyn-cloud:source

      - name: Prepare jar context
        run: |
          mkdir jar-context
          cp ops-dist/VectolynCloud.jar jar-context/

      # The release path: the jar comes in as named context and replaces the build stage.
      - name: Build release path (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cloud/dist/docker/Dockerfile
          build-contexts: jar=jar-context
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=0.0.0-ci

      - name: Build release path (linux/amd64, loaded)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cloud/dist/docker/Dockerfile
          build-contexts: jar=jar-context
          platforms: linux/amd64
          push: false
          load: true
          tags: vectolyn-cloud:release
          build-args: VERSION=0.0.0-ci

      - name: Smoke test
        run: |
          set -euo pipefail
          expect() {  # expect <exit code> <command...>
            local code=$1; shift
            local rc=0
            "$@" || rc=$?
            if [ "$rc" -ne "$code" ]; then echo "::error::exit $rc, expected $code: $*"; exit 1; fi
            echo "ok (exit $rc): $*"
          }
          for image in vectolyn-cloud:source vectolyn-cloud:release; do
            expect 0 docker run --rm "$image" --version
            expect 0 docker run --rm "$image" --help
            expect 2 docker run --rm --user 0:0 "$image" --lang en --version
            expect 0 docker run --rm --user 0:0 "$image" --allow-root --version
            test "$(docker run --rm --entrypoint id "$image" -u)" = 1000
            test "$(docker run --rm --entrypoint id "$image" -g)" = 1000
            test "$(docker inspect -f '{{.Config.StopSignal}}' "$image")" = SIGTERM
          done
          # The release image must contain exactly the jar of the release files.
          want=$(sha256sum ops-dist/VectolynCloud.jar | cut -d' ' -f1)
          got=$(docker run --rm --entrypoint sha256sum vectolyn-cloud:release /opt/vectolyn/VectolynCloud.jar | cut -d' ' -f1)
          echo "release jar $want, in image $got"
          test "$want" = "$got"
          # Informational: the source build should produce the same jar (reproducible build).
          src=$(docker run --rm --entrypoint sha256sum vectolyn-cloud:source /opt/vectolyn/VectolynCloud.jar | cut -d' ' -f1)
          if [ "$src" = "$want" ]; then echo "Source build jar is identical."; else echo "::notice::source build jar differs ($src)"; fi

      # Long-running start: health check, volume owner, and a clean stop with SIGTERM.
      - name: Run, health check, stop
        run: |
          set -euo pipefail
          docker volume create vectolyn-ci
          docker run -d --name vectolyn-ci --init -v vectolyn-ci:/data \
            --health-interval=5s --health-start-period=60s vectolyn-cloud:release --non-interactive
          for _ in $(seq 1 45); do
            health=$(docker inspect -f '{{.State.Health.Status}}' vectolyn-ci)
            [ "$health" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' vectolyn-ci)" = true ] || break
            sleep 2
          done
          docker logs vectolyn-ci
          echo "Health: $health"
          test "$health" = healthy
          test "$(docker exec vectolyn-ci stat -c %u /data)" = 1000
          docker exec vectolyn-ci test -f /data/config/cloud.yml
          docker stop -t 120 vectolyn-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' vectolyn-ci)
          echo "Exit code after docker stop: $code"
          docker logs vectolyn-ci 2>&1 | tail -n 20
          # 143 = ended by SIGTERM after the shutdown hook ran; 0 = ended normally.
          case "$code" in 0|143) ;; *) echo "::error::unexpected exit code $code"; exit 1 ;; esac
          docker rm vectolyn-ci

      # The compose example as a user runs it: cloud and MariaDB with secrets files, the image
      # pinned through VECTOLYN_VERSION (here the locally loaded release-path image under the
      # name compose.yml expects), waiting for both health checks, then a clean "down".
      - name: Compose stack (up, healthy, down)
        working-directory: cloud/dist/docker
        env:
          VECTOLYN_VERSION: ci
        run: |
          set -euo pipefail
          docker tag vectolyn-cloud:release "ghcr.io/vectode/vectolyn-cloud:${VECTOLYN_VERSION}"
          mkdir -p secrets
          openssl rand -base64 32 | tr -d '\n' > secrets/db_password
          openssl rand -base64 32 | tr -d '\n' > secrets/db_root_password
          sed 's/^eula: false/eula: true/' setup.example.yml > setup.yml
          grep -q '^eula: true' setup.yml
          trap 'docker compose logs --no-color || true; docker compose down --volumes --timeout 120 || true' EXIT
          docker compose up --detach --no-build --pull missing --wait --wait-timeout 300
          docker compose ps
          docker compose exec -T cloud test -f /data/config/cloud.yml
          test "$(docker compose exec -T cloud stat -c %u /data)" = 1000
