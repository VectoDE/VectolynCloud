name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  # BinaryArtifacts accepts gradle/wrapper/gradle-wrapper.jar only if gradle-wrapper.yml (the
  # workflow with gradle/actions/wrapper-validation) already has a successful run on the newest
  # commit of main. After a push both start at the same time, so this job waits for it. It is a job
  # of its own because the scorecard-action job may only contain `uses:` steps, otherwise the
  # results are not published (https://github.com/ossf/scorecard-action#workflow-restrictions).
  # The analysis runs anyway after the timeout; the check then reports the jar again.
  wait-for-wrapper:
    name: Wait for the wrapper validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Wait for the wrapper validation of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          head=$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha)
          echo "Newest commit of $BRANCH: $head"
          for _ in $(seq 1 40); do
            runs=$(gh api "repos/$REPO/actions/workflows/gradle-wrapper.yml/runs?head_sha=$head&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "completed")] | map(.conclusion) | join(" ")') || runs=""
            case " $runs " in
              *" success "*) echo "The wrapper validation of $head succeeded."; exit 0 ;;
            esac
            pending=$(gh api "repos/$REPO/actions/workflows/gradle-wrapper.yml/runs?head_sha=$head&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length') || pending=1
            if [ -n "$runs" ] && [ "$pending" = 0 ]; then
              echo "::warning::The wrapper validation of $head ended with: $runs"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::No successful wrapper validation of $head after 10 minutes."

  analysis:
    name: Scorecard analysis
    needs: wait-for-wrapper
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.securityscorecards.dev:443
            api.scorecard.dev:443
            api.osv.dev:443
            api.deps.dev:443
            www.bestpractices.dev:443
            bestpractices.coreinfrastructure.org:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
