name: CI

# Java matrix, see docs/java-compatibility.md:
# - "Build" compiles with the Java 25 toolchain (bytecode 21) and runs every test on Java 25,
#   on Linux and Windows. Paper 26.3 needs Java 25, so this is the runtime the plugins ship for.
# - "Tests on Java 21" compiles the same way, then runs the unit tests on a Java 21 runtime
#   (-PtestJava=21). Tests tagged "requires-java25" load paper-api classes (class file
#   version 69) and are skipped there; everything else, including the bytecode-level check,
#   must pass on 21.
# - "Integration" covers VectoraCloud end to end. It does real work only when cloud-related paths
#   change (or on the nightly schedule), but it always reports a result, so it can become a
#   required check without blocking unrelated pull requests. See the "changes" job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Explicit check that gradle/wrapper/gradle-wrapper.jar is an official Gradle release.
  # setup-gradle validates it as well; this separate job makes the check visible on its own.
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Every Gradle run verifies dependencies and plugins against gradle/verification-metadata.xml
      # (docs/dependency-verification.md). Gradle switches verification off without a word when the
      # file is missing, so this step makes sure it is there and nothing weakens it.
      - name: Check dependency verification
        run: |
          f=gradle/verification-metadata.xml
          fail() { echo "::error::$1"; exit 1; }
          [ -f "$f" ] || fail "$f is missing, dependency verification would be off."
          grep -q '<verify-metadata>true</verify-metadata>' "$f" || fail "$f must verify metadata (pom/module files) too."
          grep -q '<sha256 ' "$f" || fail "$f has no SHA-256 entries."
          if grep -qF 'update-verification-metadata.sh: temporary' "$f"; then
            fail "$f still has the temporary trust entry of gradle/update-verification-metadata.sh."
          fi
          if grep -qE '<!--|<trusted-key|<ignored-key' "$f"; then
            fail "$f must not contain XML comments or PGP keys (docs/dependency-verification.md)."
          fi
          # Only the IDE-only -javadoc/-sources jars may be trusted without a checksum.
          if [ "$(grep -c '<trust ' "$f")" -ne 2 ] \
              || ! grep -qF '<trust file=".*-javadoc[.]jar" regex="true"' "$f" \
              || ! grep -qF '<trust file=".*-sources[.]jar" regex="true"' "$f"; then
            fail "$f may only trust -javadoc.jar and -sources.jar files."
          fi
          # Structure: plain SHA-256 entries only, no PGP, <also-trust>, DOCTYPE or duplicates.
          python3 -I .github/scripts/check-verification-metadata.py "$f" || fail "$f has entries Gradle would accept without a plain SHA-256."
          grep -qxF 'org.gradle.dependency.verification=strict' gradle.properties \
            || fail "gradle.properties must set org.gradle.dependency.verification=strict."
          # Long and short Gradle options (-F for the verification mode, -M for writing the
          # metadata) and the property in any properties syntax.
          # The brackets keep the patterns from matching these lines themselves.
          weaken='--dependency-verification[= ]+(lenient|off)|dependency[.]verification[[:space:]]*[=:][[:space:]]*(lenient|off)|--write-verification-[m]etadata|gradlew.*[[:space:]]-[FM][[:space:]=]'
          if git ls-files -z -- .github/workflows '*.gradle.kts' '*gradle.properties' '*Dockerfile*' '*.gradle' \
              | xargs -0 grep -nE -- "$weaken"; then
            fail "A workflow, build or property file weakens or rewrites dependency verification (lines above)."
          fi
          echo "Dependency verification is on: $(grep -c '<component ' "$f") components with SHA-256."

  build:
    name: Build (JDK 25, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      # setup-gradle also validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        shell: bash
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
          retention-days: 7

      # Always uploaded, so it is visible which tests ran and which were skipped on each runner
      # (some need POSIX permissions or symlinks and only run on Linux).
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-xml-${{ matrix.os }}
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14

  test-java21:
    name: Tests on Java 21
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both JDKs are installed; the last one becomes JAVA_HOME and runs Gradle.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # fromEnv lets Gradle's toolchain lookup use the JDKs from setup-java
      # instead of downloading them through Foojay.
      - name: Run tests on Java 21
        run: >-
          bash ./gradlew test --no-daemon --stacktrace
          -PtestJava=21
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java21
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-xml-java21
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14

  # Path filter for the integration job. A workflow-level `on.paths` filter would leave the
  # check without any result on unrelated pull requests, and a required check without a result
  # blocks the merge. This job always runs and only decides what the integration job does.
  changes:
    name: Detect cloud changes
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.filter.outputs.cloud }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Build setup counts too: dependency versions, verification metadata, conventions.
          pattern='^((VectoraCloud|Server-Network|Vectora-Protocol|Vectora-CloudClient|gradle|build-logic)/|settings[.]gradle[.]kts$|gradle[.]properties$)'
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            cloud=true
            echo "Event $EVENT: integration always runs."
          elif [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            cloud=true
            echo "No usable base commit: integration runs to be safe."
          else
            changed=$(git diff --name-only "$BASE...$HEAD")
            if printf '%s\n' "$changed" | grep -qE "$pattern"; then
              cloud=true
            else
              cloud=false
            fi
            echo "Changed files:"
            printf '%s\n' "$changed"
          fi
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud"

  integration:
    name: Integration
    needs: changes
    # always(): this job must report a result even if "changes" failed, so it fails instead of
    # being skipped (a skipped required check counts as passed).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Require the change check
        if: needs.changes.result != 'success'
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::The change check ended with '$RESULT'."
          exit 1

      - name: No cloud-related changes
        if: needs.changes.outputs.cloud != 'true'
        run: echo "Nothing under VectoraCloud/, Server-Network/, Vectora-Protocol/, Vectora-CloudClient/ or the build setup changed. Integration is not needed."

      # VectoraCloud.jar in an empty folder, as its own process, without network: setup file,
      # built-in templates, every default server (fake server jars that log in like a bridge),
      # Java 21 for PandaSpigot and 25 for the rest, the proxies' server lists and the shutdown.
      # See docs/cloud/node.md#end-to-end-test.
      - name: Checkout
        if: needs.changes.outputs.cloud == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both JDKs are installed: the servers need exactly 21 and 25. The last one runs Gradle.
      - name: Set up JDK 21 and 25
        if: needs.changes.outputs.cloud == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        if: needs.changes.outputs.cloud == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: End-to-end test of VectoraCloud.jar
        if: needs.changes.outputs.cloud == 'true'
        run: >-
          bash ./gradlew :VectoraCloud:cloud-node:e2eTest --no-daemon --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test report
        if: failure() && needs.changes.outputs.cloud == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-e2e
          path: VectoraCloud/cloud-node/build/reports/tests/e2eTest/
          retention-days: 7
