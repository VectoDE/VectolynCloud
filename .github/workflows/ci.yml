name: CI

# Java matrix, see docs/java-compatibility.md:
# - "Build" compiles with the Java 25 toolchain (bytecode 21) and runs every test on Java 25,
#   on Linux and Windows. Paper 26.3 needs Java 25, so this is the runtime the plugins ship for.
# - "Tests on Java 21" compiles the same way, then runs the unit tests on a Java 21 runtime
#   (-PtestJava=21). Tests tagged "requires-java25" load paper-api classes (class file
#   version 69) and are skipped there; everything else, including the bytecode-level check,
#   must pass on 21.
# - "Integration" covers VectoraCloud end to end. It does real work only when cloud-related paths
#   change (or on the nightly schedule), but it always reports a result, so it can become a
#   required check without blocking unrelated pull requests. See the "changes" job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Explicit check that gradle/wrapper/gradle-wrapper.jar is an official Gradle release.
  # setup-gradle validates it as well; this separate job makes the check visible on its own.
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  build:
    name: Build (JDK 25, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      # setup-gradle also validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        shell: bash
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
          retention-days: 7

  test-java21:
    name: Tests on Java 21
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both JDKs are installed; the last one becomes JAVA_HOME and runs Gradle.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # fromEnv lets Gradle's toolchain lookup use the JDKs from setup-java
      # instead of downloading them through Foojay.
      - name: Run tests on Java 21
        run: >-
          bash ./gradlew test --no-daemon --stacktrace
          -PtestJava=21
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java21
          path: '**/build/reports/tests/'
          retention-days: 7

  # Path filter for the integration job. A workflow-level `on.paths` filter would leave the
  # check without any result on unrelated pull requests, and a required check without a result
  # blocks the merge. This job always runs and only decides what the integration job does.
  changes:
    name: Detect cloud changes
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.filter.outputs.cloud }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pattern='^(VectoraCloud|Server-Network|Vectora-Protocol|Vectora-CloudClient)/'
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            cloud=true
            echo "Event $EVENT: integration always runs."
          elif [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            cloud=true
            echo "No usable base commit: integration runs to be safe."
          else
            changed=$(git diff --name-only "$BASE...$HEAD")
            if printf '%s\n' "$changed" | grep -qE "$pattern"; then
              cloud=true
            else
              cloud=false
            fi
            echo "Changed files:"
            printf '%s\n' "$changed"
          fi
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud"

  integration:
    name: Integration
    needs: changes
    # always(): this job must report a result even if "changes" failed, so it fails instead of
    # being skipped (a skipped required check counts as passed).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Require the change check
        if: needs.changes.result != 'success'
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::The change check ended with '$RESULT'."
          exit 1

      - name: No cloud-related changes
        if: needs.changes.outputs.cloud != 'true'
        run: echo "Nothing under VectoraCloud/, Server-Network/, Vectora-Protocol/ or Vectora-CloudClient/ changed. Integration is not needed."

      # Scaffold. The real integration test (VectoraCloud.jar starting Velocity and Paper with
      # H2 storage, plus a fake server jar) replaces this step once the jar exists.
      - name: Integration tests (scaffold, no tests yet)
        if: needs.changes.outputs.cloud == 'true'
        run: |
          echo "Integration job scaffold: there is no VectoraCloud.jar to start yet."
          {
            echo "### Integration"
            echo "Scaffold only. The integration test arrives together with VectoraCloud.jar."
          } >> "$GITHUB_STEP_SUMMARY"
