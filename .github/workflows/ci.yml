name: CI

# Java matrix, see docs/java-compatibility.md:
# - "Build" compiles with the Java 25 toolchain (bytecode 21) and runs every test on Java 25,
#   on Linux and Windows. Paper 26.3 needs Java 25, so this is the runtime the plugins ship for.
# - "Tests on Java 21" compiles the same way, then runs the unit tests on a Java 21 runtime
#   (-PtestJava=21). Tests tagged "requires-java25" load paper-api classes (class file
#   version 69) and are skipped there; everything else, including the bytecode-level check,
#   must pass on 21.
# - "Tests on Java 27 (newest GA)" runs the same unit tests on the newest Java release, so a
#   change of a later JDK (removed API, stricter checks) shows up before users run into it.
# - "API compatibility" compares the public API of common/protocol and common/client with the
#   newest release tag (japicmp) and fails on an incompatible change unless the version in
#   gradle.properties is a breaking step (docs/api-compatibility.md).
# - "Integration" covers VectolynCloud end to end. It does real work only when cloud-related paths
#   change (or on the nightly schedule), but it always reports a result, so it can become a
#   required check without blocking unrelated pull requests. See the "changes" job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK 25, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # On Windows harden-runner's agent only becomes active about a minute into the job and
      # then cuts off downloads already running (seen with Gradle), so Windows only audits.
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: ${{ runner.os == 'Windows' && 'audit' || 'block' }}
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The web panel's frontend (cloud/panel/web) is built into the jar on Linux, as in a release.
      - name: Set up Node.js
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache: a poisoned cache must not reach a build (zizmor cache-poisoning).
          package-manager-cache: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      # setup-gradle also validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        shell: bash
        env:
          PANEL_WEB: ${{ runner.os == 'Linux' }}
        run: bash ./gradlew build --no-daemon --stacktrace "-Pvectolyn.panel.web=$PANEL_WEB"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
          retention-days: 7

      # Always uploaded, so it is visible which tests ran and which were skipped on each runner
      # (some need POSIX permissions or symlinks and only run on Linux).
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-xml-${{ matrix.os }}
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14

  # The web panel's frontend on its own: the catalogues of both languages match, the TypeScript
  # types check, and the static export builds (docs/cloud/panel.md).
  panel-web:
    name: Panel frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache: a poisoned cache must not reach a build (zizmor cache-poisoning).
          package-manager-cache: false

      - name: Install
        working-directory: cloud/panel/web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Languages
        working-directory: cloud/panel/web
        run: npm run check-i18n

      - name: Static export
        working-directory: cloud/panel/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # After the build: next build writes next-env.d.ts, which the type check needs.
      - name: Types
        working-directory: cloud/panel/web
        run: npm run typecheck

  # The panel in a real browser: Playwright drives the panel preview (real server, built frontend,
  # made-up node) through setup, sign-in and every page in both languages; axe-core checks WCAG 2.2
  # AA on each page and Lighthouse requires accessibility and best practices 100 and a layout
  # shift under 0.1. Uses the Chrome of the runner, so no browser is downloaded.
  panel-e2e:
    name: Panel end-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install test tools
        working-directory: cloud/panel/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: End-to-end, axe-core and Lighthouse
        working-directory: cloud/panel/e2e
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          PANEL_E2E_CHANNEL: chrome
        run: npx playwright test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-e2e-reports
          path: |
            cloud/panel/e2e/playwright-report/
            cloud/panel/e2e/lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14

  # The website generator (site/): unit tests of the release lookup behind the download page
  # (missing asset, missing checksum, no release data, pre-release, offline copy) and an offline
  # build from the cached data, so a broken page fails here before the Pages workflow on main.
  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Tests
        run: node --test site/test/*.test.mjs

      - name: Offline build
        env:
          SITE_OFFLINE: '1'
        run: sh site/build.sh

  test-java21:
    name: Tests on Java 21
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both JDKs are installed; the last one becomes JAVA_HOME and runs Gradle.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # fromEnv lets Gradle's toolchain lookup use the JDKs from setup-java
      # instead of downloading them through Foojay.
      - name: Run tests on Java 21
        run: >-
          bash ./gradlew test --no-daemon --stacktrace
          -PtestJava=21
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java21
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-xml-java21
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14

  test-java-newest:
    name: Tests on Java 27 (newest GA)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle runs on 25 (the toolchain); the tests run on the newest GA release. Raise the
      # version here, in operations.yml (jar matrix) and in docs/java-compatibility.md together.
      - name: Set up JDK 27 and 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            27
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # fromEnv lets Gradle's toolchain lookup use the JDKs from setup-java
      # instead of downloading them through Foojay.
      - name: Run tests on Java 27
        run: >-
          bash ./gradlew test --no-daemon --stacktrace
          -PtestJava=27
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64,JAVA_HOME_25_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java27
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-xml-java27
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14

  # Public API of common/protocol and common/client against the newest release tag
  # (docs/api-compatibility.md). The baseline jars are built from that tag with its own build.
  api-compat:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      # The whole history, so the release tags are there.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Newest vX.Y.Z[-suffix] tag in the history of this commit; versionsort.suffix sorts
      # v1.0.0-rc.1 before v1.0.0.
      - name: Find the baseline release
        id: baseline
        run: |
          tag=$(git -c versionsort.suffix=- tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname --merged HEAD | head -n 1)
          if [ -z "$tag" ]; then
            echo "No release tag yet, nothing to compare against." >> "$GITHUB_STEP_SUMMARY"
          elif ! printf '%s' "$tag" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::unexpected tag name"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the baseline jars
        if: steps.baseline.outputs.tag != ''
        env:
          TAG: ${{ steps.baseline.outputs.tag }}
        run: |
          base="$RUNNER_TEMP/baseline"
          git worktree add --detach "$base" "refs/tags/$TAG"
          bash "$base/gradlew" -p "$base" --no-daemon --no-build-cache --no-configuration-cache :common:protocol:jar :common:client:jar
          mkdir -p "$RUNNER_TEMP/baseline-jars"
          for module in protocol client; do
            set -- "$base/common/$module/build/libs/"*.jar
            if [ "$#" -ne 1 ]; then echo "::error::expected one jar for $module, found: $*"; exit 1; fi
            cp "$1" "$RUNNER_TEMP/baseline-jars/$module.jar"
          done

      - name: Compare the API
        if: steps.baseline.outputs.tag != ''
        env:
          TAG: ${{ steps.baseline.outputs.tag }}
        run: >-
          bash ./gradlew :tools:api-compat:apiCompat --no-daemon --stacktrace
          "-PapiBaselineDir=$RUNNER_TEMP/baseline-jars" "-PapiBaselineTag=$TAG"

      - name: Report
        if: always() && steps.baseline.outputs.tag != ''
        run: |
          report=tools/api-compat/build/reports/api-compat/report.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

  # Path filter for the integration job. A workflow-level `on.paths` filter would leave the
  # check without any result on unrelated pull requests, and a required check without a result
  # blocks the merge. This job always runs and only decides what the integration job does.
  changes:
    name: Detect cloud changes
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.filter.outputs.cloud }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Build setup counts too: dependency versions, verification metadata, conventions.
          pattern='^((cloud|common|plugins/bridge|templates|gradle|build-logic)/|settings[.]gradle[.]kts$|gradle[.]properties$)'
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            cloud=true
            echo "Event $EVENT: integration always runs."
          elif [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            cloud=true
            echo "No usable base commit: integration runs to be safe."
          else
            changed=$(git diff --name-only "$BASE...$HEAD")
            if printf '%s\n' "$changed" | grep -qE "$pattern"; then
              cloud=true
            else
              cloud=false
            fi
            echo "Changed files:"
            printf '%s\n' "$changed"
          fi
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud"

  integration:
    name: Integration
    needs: changes
    # always(): this job must report a result even if "changes" failed, so it fails instead of
    # being skipped (a skipped required check counts as passed).
    if: always()
    runs-on: ubuntu-latest
    # The job normally takes about a minute; a hanging end-to-end test must not run for six hours.
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443

      - name: Require the change check
        if: needs.changes.result != 'success'
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::The change check ended with '$RESULT'."
          exit 1

      - name: No cloud-related changes
        if: needs.changes.outputs.cloud != 'true'
        run: echo "Nothing under cloud/, common/, plugins/bridge/, templates/ or the build setup changed. Integration is not needed."

      # VectolynCloud.jar in an empty folder, as its own process, without network: setup file,
      # built-in templates, every default server (fake server jars that log in like a bridge),
      # Java 21 for PandaSpigot and 25 for the rest, the proxies' server lists and the shutdown.
      # See docs/cloud/node.md#end-to-end-test.
      - name: Checkout
        if: needs.changes.outputs.cloud == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both JDKs are installed: the servers need exactly 21 and 25. The last one runs Gradle.
      - name: Set up JDK 21 and 25
        if: needs.changes.outputs.cloud == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        if: needs.changes.outputs.cloud == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: End-to-end test of VectolynCloud.jar
        if: needs.changes.outputs.cloud == 'true'
        run: >-
          bash ./gradlew :cloud:node:e2eTest --no-daemon --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test report
        if: failure() && needs.changes.outputs.cloud == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-e2e
          path: cloud/node/build/reports/tests/e2eTest/
          retention-days: 7
