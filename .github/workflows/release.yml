name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # keyless signing (cosign) and attestations
      attestations: write   # actions/attest-build-provenance
    outputs:
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.adoptium.net:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo.papermc.io:443
            repo.hpfxd.com:443
            api.foojay.io:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Gradle toolchain is Java 25 (bytecode 21), see docs/java-compatibility.md.
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The version rules, checked before anything is built or signed (docs/cloud/operations.md#versions-and-tags):
      # v<MAJOR>.<MINOR>.<PATCH> with -dev[.N] (the only choice below 1.0.0), -alpha[.N], -beta[.N],
      # -rc[.N], -lts or no suffix. The parser is the one that draws the banner (tools/release-banner,
      # ReleaseVersion); operations.yml runs the same script on every rule on each pull request.
      # Its result sets the GitHub pre-release flag and the image tags ("latest", "dev") below.
      - name: Check release tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! result=$(bash tools/release-banner/check-tag.sh "$TAG" --no-daemon --no-build-cache 2> "$RUNNER_TEMP/tag.log"); then
            cat "$RUNNER_TEMP/tag.log"
            reason=$(grep -m1 '^error: ' "$RUNNER_TEMP/tag.log" || echo "error: see the log of this step")
            reason=${reason#error: }
            echo "::error title=Release tag rejected::${reason//%/%25}"
            exit 1
          fi
          printf '%s\n' "$result" | tee -a "$GITHUB_OUTPUT"

      # The tag (v1.2.3) sets the version of every module. The full build runs all tests, but
      # only VectolynCloud.jar is released: the plugin jars are not part of a release (the
      # owner's decision of 2026-10-29); operators build them from the repository.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: bash ./gradlew build --no-daemon --no-build-cache -Pversion="${TAG#v}"

      # The release files: VectolynCloud.jar plus one archive per operating system with the
      # start scripts; the banner images of the next step are the only other files. The same
      # script runs as a dry run in operations.yml on every pull request.
      - name: Package VectolynCloud
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash cloud/dist/package.sh "${TAG#v}" \
            cloud/launcher/build/cloud/VectolynCloud.jar dist
          ls -l dist

      # The image at the top of the release notes, 1280 x 320 and 2560 x 640: the committed
      # background (branding/png/) with version, badge, title and date drawn by
      # tools/release-banner. Title = first line of the tag message, date = tagger date (UTC).
      # actions/checkout fetches only the commit and leaves an annotated tag as a lightweight
      # one, so the tag object itself is fetched first. If the tag was moved since the run
      # started, it no longer points at the built commit and the release stops. A banner that
      # cannot be drawn (invalid tag, a character the font lacks, ...) fails the release; there
      # is no fallback.
      # operations.yml runs the same script on a local tag on every pull request.
      - name: Release banner
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$GITHUB_SHA" || { echo "::error::tag ${TAG} no longer points at ${GITHUB_SHA}"; exit 1; }
          bash tools/release-banner/banner-from-tag.sh "$TAG" dist --no-daemon --no-build-cache
          ls -l dist

      # SHA256SUMS lists exactly the five release files; the provenance covers every file in it,
      # so nothing may be missing and nothing else may slip in.
      - name: Checksums
        id: hash
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          files=(VectolynCloud.jar "VectolynCloud-${version}-windows.zip" "VectolynCloud-${version}-linux-macos.tar.gz"
            "VectolynCloud-${version}-banner.png" "VectolynCloud-${version}-banner-2x.png")
          found=$(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          want=$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)
          if [ "$found" != "$want" ]; then
            printf '::error::unexpected release files:\n%s\n' "$found"
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign with cosign (keyless)
        working-directory: dist
        # Retries: v0.1.0 failed once with a Rekor 409 (cosign retried an upload that had
        # already landed). A fresh attempt signs again with a new certificate and succeeds.
        run: |
          for f in *.jar *.zip *.tar.gz *.png SHA256SUMS; do
            for attempt in 1 2 3; do
              if cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::signing $f failed three times"
                exit 1
              fi
              echo "::warning::signing $f failed (attempt $attempt), retrying"
              sleep $((attempt * 10))
            done
          done

      # SLSA build provenance (in-toto statement, signed with Sigstore) for every file in
      # SHA256SUMS. GitHub keeps it in the repository's attestations; the bundle also goes into the
      # release as vectolyn.intoto.jsonl, so it can be checked without the GitHub API.
      # This replaces slsa-github-generator: that reusable workflow has to be referenced by tag
      # (slsa-verifier rejects a commit SHA), and every action in this workflow is pinned by digest.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # Written after the checksums and the signatures on purpose: the provenance describes the
      # five release files, it is not one of them.
      - name: Provenance file for the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -c . "$BUNDLE" > dist/vectolyn.intoto.jsonl
          test "$(wc -l < dist/vectolyn.intoto.jsonl)" -eq 1
          jq -r '.dsseEnvelope.payloadType' dist/vectolyn.intoto.jsonl

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # Container image on GHCR with the signed VectolynCloud.jar of the build job (not rebuilt: the
  # named build context "jar" replaces the Dockerfile's build stage). Signed with cosign keyless,
  # with a GitHub build provenance attestation and BuildKit's SBOM and provenance in the registry.
  # "latest" only for releases that are not GitHub pre-releases (stable and -lts): the same flag as
  # the GitHub release, from the tag check of the build job.
  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # keyless signing (cosign) and attestations
      attestations: write   # actions/attest-build-provenance
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            *.sigstore.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Only the jar goes into the build context, and only if it is the one in SHA256SUMS.
      - name: Prepare jar context
        run: |
          set -euo pipefail
          (cd dist && grep -E '^[0-9a-f]{64}  VectolynCloud\.jar$' SHA256SUMS | sha256sum --check --strict -)
          mkdir jar-context
          cp dist/VectolynCloud.jar jar-context/

      - name: Image name and tags
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/${OWNER,,}/vectolyn-cloud"
          tags="${image}:${version}"
          case "$PRERELEASE" in
            true) echo "Pre-release: no latest tag." ;;
            false) tags="${tags},${image}:latest" ;;
            *) echo "::error::no pre-release flag from the tag check"; exit 1 ;;
          esac
          # "dev" is a moving tag: always the newest -dev release. It shares the digest of the
          # version tag, so the signature and attestation below (by digest) cover it too.
          if [ "$CHANNEL" = "dev" ]; then
            tags="${tags},${image}:dev"
          fi
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cloud/dist/docker/Dockerfile
          build-contexts: jar=jar-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the multi-arch index by digest, never by tag. Same retry as the blob signatures.
      - name: Sign image with cosign (keyless)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if cosign sign --yes "$REF"; then
              exit 0
            fi
            echo "::warning::signing $REF failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          echo "::error::signing $REF failed three times"
          exit 1

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub release
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          # -dev, -alpha, -beta and -rc are pre-releases; -lts and stable releases are not and
          # become the "Latest" release (the owner's rule of 2026-10-30). The flag comes from the
          # tag check of the build job.
          prerelease=""
          case "$PRERELEASE" in
            true) prerelease="--prerelease" ;;
            false) ;;
            *) echo "::error::no pre-release flag from the tag check"; exit 1 ;;
          esac
          # The banner on top, from this release's own assets (the 2x file, shown at 1280 px).
          # TAG passed the version rules of the build job, so it is safe inside HTML.
          banner="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/VectolynCloud-${TAG#v}-banner-2x.png"
          notes=$(printf '%s\n' \
            "<img src=\"${banner}\" alt=\"VectolynCloud ${TAG}\" width=\"1280\">" \
            "" \
            "Container image: \`${IMAGE}:${TAG#v}\` (\`${IMAGE}@${DIGEST}\`)" \
            "" \
            "How to check signatures and provenance: [docs/cloud/operations.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/cloud/operations.md#verifying-a-release)")
          # --notes comes first, the generated notes follow.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$notes" \
            --generate-notes \
            --verify-tag \
            $prerelease
