name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # keyless signing (cosign) and attestations
      attestations: write   # actions/attest-build-provenance
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Gradle toolchain is Java 25 (bytecode 21), see docs/java-compatibility.md.
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The tag (v1.2.3) sets the version, so plugin.yml and the jar names match the release.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: bash ./gradlew build --no-daemon --no-build-cache -Pversion="${TAG#v}"

      # Each plugin module produces exactly one jar (no -plain, -sources or -javadoc jars).
      # Stage 3 replaces them with Vectora-Paper.jar, Vectora-Velocity.jar and
      # Vectora-Fabric.jar; this list changes with it.
      - name: Collect jars
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          for jar in \
            "Vectora-Lobby/build/libs/VectoraLobby-${version}.jar" \
            "Vectora-PortalBridge/build/libs/VectoraPortalBridge-${version}.jar"; do
            test -f "$jar" || { echo "::error::missing $jar"; exit 1; }
            cp "$jar" dist/
          done
          ls -l dist

      - name: Checksums
        id: hash
        working-directory: dist
        run: |
          sha256sum -- *.jar > SHA256SUMS
          cat SHA256SUMS
          echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign with cosign (keyless)
        working-directory: dist
        run: |
          for f in *.jar SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  provenance:
    name: SLSA provenance
    needs: build
    permissions:
      actions: read     # read the workflow run
      id-token: write   # sign the provenance
      contents: write   # required by the generator, assets are uploaded by the release job
    # The SLSA generator must be referenced by tag, not by commit SHA.
    # Scorecard accepts this exception for slsa-github-generator.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: vectora.intoto.jsonl
      upload-assets: false

  release:
    name: Publish GitHub release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
