name: Bug report
description: Something does not work as described. / Etwas funktioniert nicht wie beschrieben.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please write in English or German.
        Security problems do not belong here, see SECURITY.md.

        _DE: Du kannst auf Deutsch oder Englisch schreiben. Sicherheitslücken bitte nicht hier melden, siehe SECURITY.md._
  - type: dropdown
    id: area
    attributes:
      label: Area / Bereich
      options:
        - Proxy / crossplay
        - Lobby
        - Survival
        - Creative
        - Mod server
        - End server
        - Minigames
        - VectoraCloud
        - Vectora plugin
        - Build / CI
        - Documentation / wiki
        - Other / Sonstiges
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / Was ist passiert?
      description: Describe the bug and what you expected instead. / Beschreib den Fehler und was du stattdessen erwartet hast.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Schritte zum Nachstellen
      placeholder: |
        1. Join with a Bedrock client
        2. Open the navigator
        3. ...
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      multiple: true
      options:
        - Java Edition
        - Bedrock Edition
        - Not client related / Kein Client-Bezug
  - type: input
    id: versions
    attributes:
      label: Versions / Versionen
      description: Minecraft client version, Vectora version or commit, Java version, OS. / Client-Version, Vectora-Version oder Commit, Java-Version, Betriebssystem.
      placeholder: "Java 1.8.9 client, commit abc1234, Temurin 21, Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove IPs, tokens and passwords first. / Relevante Log-Zeilen, vorher IPs, Tokens und Passwörter entfernen.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues. / Ich habe die vorhandenen Issues durchsucht.
          required: true
        - label: The logs contain no secrets or personal data. / Die Logs enthalten keine Secrets oder personenbezogenen Daten.
          required: true
