# SonarCloud analysis (the scan runs in .github/workflows/code-scanners.yml, job "SonarCloud").
# The organisation and the project key are the ones SonarCloud proposes when the repository is
# imported (docs/code-scanning.md). Change them here if the owner picks other values.
sonar.organization=vectode
sonar.projectKey=VectoDE_VectolynCloud
sonar.projectName=VectolynCloud
sonar.sourceEncoding=UTF-8

# One scan for the whole Gradle multi-module build: main and test sources are told apart by path.
sonar.sources=.
sonar.inclusions=**/src/main/**
sonar.tests=.
sonar.test.inclusions=**/src/test/**
sonar.exclusions=**/build/**,templates/**,branding/**,site/**,resourcepack/**,**/src/main/resources/**/*.json

# Class files and coverage of the Gradle build (JaCoCo, issue #223).
sonar.java.binaries=**/build/classes/java/main
sonar.java.test.binaries=**/build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml

# The workflow fails when the quality gate of the project fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
