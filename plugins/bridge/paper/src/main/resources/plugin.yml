name: VectolynCloudBridge
version: '${pluginVersion}'
main: net.vectolyn.cloud.bridge.paper.PaperBridgePlugin
api-version: '26.3'
description: Connects a Paper server to VectolynCloud (ready signal, status and network kicks).
author: Vectolyn
permissions:
