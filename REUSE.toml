version = 1
SPDX-PackageName = "VectolynCloud"
SPDX-PackageSupplier = "VectoDE"
SPDX-PackageDownloadLocation = "https://github.com/VectoDE/VectolynCloud"

# Order matters: later annotations win. General rules first, specific overrides last.

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 VectoDE"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["branding/**", "resourcepack/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VectoDE"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "branding/fonts/atkinson-hyperlegible-next/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "branding/fonts/jetbrains-mono/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "branding/fonts/pixelify-sans/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2021 The Pixelify Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "gradle/wrapper/gradle-wrapper.jar"
precedence = "override"
SPDX-FileCopyrightText = "Copyright Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["site/assets/fonts/pixelify-sans.woff2", "site/assets/fonts/OFL-pixelify-sans.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2021 The Pixelify Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/assets/fonts/inter.woff2", "site/assets/fonts/OFL-inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/assets/fonts/jetbrains-mono.woff2", "site/assets/fonts/OFL-jetbrains-mono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# three.js 0.170.0 (npm tarball sha512-FQK+LEpYc0fBD+J8g6oSEyyNzjp+Q7Ks1C568WWaoMRLW+TkNNWmenWeGgJjV105Gd+p/2ql1ZcjYvNiPZBhuQ==), build/three.module.min.js unchanged
[[annotations]]
path = "site/assets/vendor/three/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2010-2024 Three.js Authors"
SPDX-License-Identifier = "MIT"

# Rendered from site/assets/scene.js; shows the Vectolyn mark, so it follows the brand licence
[[annotations]]
path = "site/assets/img/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 VectoDE"
SPDX-License-Identifier = "CC-BY-SA-4.0"
