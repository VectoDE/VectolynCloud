    statement: "Optional prebuilt image libraries of sharp (@img/sharp-*), an optional dependency of Next.js for next/image. The panel frontend is a static export with images.unoptimized, so sharp is never called; npm installs only the package of the build machine, it is used at build time only and nothing of it reaches the jar or the release. LGPL-3.0-or-later is compatible with the project's GPL-3.0-or-later. Listed in docs/licenses/DEPENDENCY-LICENSES.md."
