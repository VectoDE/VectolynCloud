[versions]
# Keep in step with the Paper build that runs on the backends (Server-Network/*/runtime/paper.jar).
paper-api = "26.3.build.226-stable"
# API of the Velocity 4.3.x proxy (Server-Network/Proxy). compileOnly in cloud-bridge-velocity.
velocity-api = "4.3.1"
# API of PandaSpigot 1.8.8 (Server-Network/Legacy-Server). Only a snapshot is published, so the build
# pins one unique snapshot instead of the moving 1.8.8-R0.1-SNAPSHOT. compileOnly in cloud-bridge-legacy.
pandaspigot-api = "1.8.8-R0.1-20251003.170525-12"
# Adventure as declared by that pandaspigot-api; javac needs its types to resolve Bukkit's overloads.
pandaspigot-adventure = "4.24.0"
junit = "6.1.3"
snakeyaml = "2.7"
# VectoraCloud runtime libraries, reasons in docs/cloud/architecture.md.
netty = "4.2.19.Final"
jline = "3.30.17"
jackson = "3.2.4"
mariadb-java-client = "4.0.0"
# Fuzz tests (test scope only), see build-logic/src/main/kotlin/vectora.fuzz-conventions.gradle.kts.
jazzer = "0.30.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
pandaspigot-api = { module = "com.hpfxd.pandaspigot:pandaspigot-api", version.ref = "pandaspigot-api" }
pandaspigot-adventure-api = { module = "net.kyori:adventure-api", version.ref = "pandaspigot-adventure" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport" }
netty-handler = { module = "io.netty:netty-handler" }
netty-codec-http = { module = "io.netty:netty-codec-http" }

jline-terminal = { module = "org.jline:jline-terminal", version.ref = "jline" }
jline-reader = { module = "org.jline:jline-reader", version.ref = "jline" }
jline-terminal-jni = { module = "org.jline:jline-terminal-jni", version.ref = "jline" }
# Needs Java 22+ at runtime (Foreign Function & Memory API). The Java 21 path is jline-terminal-jni.
jline-terminal-ffm = { module = "org.jline:jline-terminal-ffm", version.ref = "jline" }

jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }

mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-java-client" }

jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
