#Minecraft server properties
# PandaSpigot 1.8.8 behind the legacy proxy (Velocity, bungeeguard forwarding).
# online-mode stays false: the legacy proxy authenticates players, see spigot.yml and pandaspigot.yml.
allow-flight=false
allow-nether=false
announce-player-achievements=false
difficulty=1
enable-command-block=false
enable-query=false
enable-rcon=false
force-gamemode=true
gamemode=0
generate-structures=true
generator-settings=
hardcore=false
level-name=world
level-seed=
level-type=DEFAULT
max-build-height=256
max-players=20
max-tick-time=60000
max-world-size=29999984
motd=A Minecraft Server
network-compression-threshold=256
online-mode=false
op-permission-level=4
player-idle-timeout=0
pvp=true
resource-pack=
resource-pack-hash=
server-ip={{VECTORA_SERVER_HOST}}
server-port={{VECTORA_SERVER_PORT}}
snooper-enabled=false
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
spawn-protection=0
use-native-transport=true
view-distance=10
white-list=false
