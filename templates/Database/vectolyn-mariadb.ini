# Vectolyn MariaDB (portable, Windows)
# basedir and datadir are passed on the command line by start-vectolyn-database.cmd,
# relative to this folder, so the setup keeps working wherever the repository lives.
[mysqld]
port={{VECTOLYN_DB_PORT}}
bind-address={{VECTOLYN_DB_HOST}}
skip-name-resolve
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
# 6 LuckPerms instances x maximum-pool-size 4 = 24 pooled connections,
# plus headroom for VectolynCloud, admin clients and future plugins.
max_connections=150
innodb_buffer_pool_size=256M

[client]
host={{VECTOLYN_DB_HOST}}
port={{VECTOLYN_DB_PORT}}
default-character-set=utf8mb4
